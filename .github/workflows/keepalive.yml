name: Keep-alive ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://decrocheai-backend.onrender.com/health)
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "Service alive" || echo "WARNING: unexpected status $STATUS"
